name: Code Coverage Check

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'


      - name: Build and Test with Coverage
        run: |
          mvn clean verify

      - name: Check Coverage
        run: |
          COVERAGE=$(grep -oP 'Total.*?\K\d+(?=%)' target/site/jacoco/index.html)
          echo "Coverage: $COVERAGE%"
          if [ "$COVERAGE" -lt 10 ]; then
            echo "❌ Code coverage too low! Must be at least 10%."
            exit 1
          fi
